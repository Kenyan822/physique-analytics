openapi: 3.1.0

info:
  title: physique-analytics API
  version: 0.1.0
  description: |
    トレーニング・栄養・体組成を統合して分析するアプリの API。

    このファイルが **型の唯一の正** であり、Go サーバ・TypeScript クライアント・
    Swift クライアントのコードはすべてここから生成する（ADR-0007）。
    手で型を書かないこと。

    ## 日付の扱い
    `date` はすべて **JST（Asia/Tokyo）における日付**（ADR-0013）。
    端末のタイムゾーンに依存しない。クライアントが JST で計算して送る。

    ## 同期と削除
    すべてのリソースが `updatedAt` / `deletedAt` を持つ（ADR-0014）。
    競合は `updatedAt` が新しい方を採用する（Last Write Wins）。
    削除は物理削除せず `deletedAt` を立てる。
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com
    description: production
  - url: http://localhost:8080
    description: local

security:
  - bearerAuth: []

tags:
  - name: health
  - name: exercises
    description: 種目マスタ
  - name: workouts
    description: トレーニング記録
  - name: templates
    description: トレーニングテンプレート
  - name: body
    description: 体組成・周囲長
  - name: nutrition
    description: 食事記録
  - name: plan
    description: 計画の設定・大会
  - name: sync
    description: オフライン同期
  - name: transfer
    description: CSV インポート / エクスポート

paths:
  # パスは /healthz にしない。Cloud Run の Google Frontend が
  # このパスちょうど1つだけを終端し、コンテナまで届かない（issue #32）。
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: ヘルスチェック
      description: |
        DB 接続を含む疎通確認。Supabase の7日間非アクティブによる
        自動停止を回避する keepalive も兼ねる（インフラ設計 §2.1）。
      security: []
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, enum: [ok] }
                  time: { type: string, format: date-time }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/exercises:
    get:
      operationId: listExercises
      tags: [exercises]
      summary: 種目の一覧
      parameters:
        - $ref: "#/components/parameters/MuscleGroup"
        - $ref: "#/components/parameters/IncludeDeleted"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Exercise" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createExercise
      tags: [exercises]
      summary: 種目を追加
      description: |
        種目マスタ（49種目）はマイグレーションで投入済み。ここでは独自種目を追加する。
        既存の種目と同じものを別表記で追加しない。時系列が分断される。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExerciseInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/exercises/{exerciseId}:
    parameters:
      - $ref: "#/components/parameters/ExerciseId"
    get:
      operationId: getExercise
      tags: [exercises]
      summary: 種目の取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateExercise
      tags: [exercises]
      summary: 種目の更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExerciseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteExercise
      tags: [exercises]
      summary: 種目の削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions:
    get:
      operationId: listWorkoutSessions
      tags: [workouts]
      summary: セッションの一覧
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSession" }
                  nextCursor:
                    type: [string, "null"]
                    description: 次ページがある場合のカーソル
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createWorkoutSession
      tags: [workouts]
      summary: セッションの作成（セットを含めて一括登録できる）
      description: |
        オフラインで記録した内容を一括送信するため、セットを含めて作成できる。
        クライアントが生成した UUID を `id` に指定すると冪等に扱われる
        （同じ id での再送は 200 を返す）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutSessionInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
        "200":
          description: 既に同じ id で作成済み（冪等）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/workout-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getWorkoutSession
      tags: [workouts]
      summary: セッションの取得（セットを含む）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkoutSession
      tags: [workouts]
      summary: セッションの更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                templateId: { type: [string, "null"], format: uuid }
                note: { type: [string, "null"] }
                updatedAt:
                  type: string
                  format: date-time
                  description: |
                    クライアントが保持する更新時刻。サーバ側がこれより新しい場合は
                    409 を返す（ADR-0014）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteWorkoutSession
      tags: [workouts]
      summary: セッションの削除（論理削除。配下のセットも削除される）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions/{sessionId}/sets:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createWorkoutSet
      tags: [workouts]
      summary: セットの追加
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutSetInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSet" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/workout-sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/SetId"
    patch:
      operationId: updateWorkoutSet
      tags: [workouts]
      summary: セットの更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutSetInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSet" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteWorkoutSet
      tags: [workouts]
      summary: セットの削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/exercises/{exerciseId}/last-performance:
    parameters:
      - $ref: "#/components/parameters/ExerciseId"
    get:
      operationId: getLastPerformance
      tags: [workouts]
      summary: 前回の実施内容
      description: |
        要件 T-02（前回値のデフォルト表示）のためのエンドポイント。
        入力速度を決める最重要機能であり、1リクエストで取得できるようにする。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [exerciseId]
                properties:
                  exerciseId: { type: string, format: uuid }
                  date:
                    type: [string, "null"]
                    format: date
                    description: 前回実施日。未実施なら null
                  sets:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSet" }
                  estimatedOneRm:
                    type: [number, "null"]
                    description: 前回の推定1RM（Epley + RIR補正）
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: テンプレートの一覧
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createTemplate
      tags: [templates]
      summary: テンプレートの作成
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      operationId: getTemplate
      tags: [templates]
      summary: テンプレートの取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTemplate
      tags: [templates]
      summary: テンプレートの更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTemplate
      tags: [templates]
      summary: テンプレートの削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/daily:
    get:
      operationId: listDailyMetrics
      tags: [body]
      summary: 日次記録の一覧
      description: |
        体重・体脂肪率・PFC・回復指標。**1日1行**。
        分析（TDEE の逆算・正規化FFMI・回復判定）の入力になる。
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DailyMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: putDailyMetrics
      tags: [body]
      summary: 日次記録の登録・更新
      description: |
        日付をキーにした upsert。同じ日に何度も書ける
        （朝に体重、夜に食事、というように分けて入力する）。

        **省略した・null のフィールドは変更しない。** 値を消したいときは
        その日を DELETE して入れ直す。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyMetricsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyMetrics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/daily/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
        description: JST の日付（ADR-0013）
    get:
      operationId: getDailyMetrics
      tags: [body]
      summary: 日次記録の取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyMetrics" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDailyMetrics
      tags: [body]
      summary: 日次記録の削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/measurements:
    get:
      operationId: listMeasurements
      tags: [body]
      summary: 周囲長の一覧
      description: |
        要件 B-02。**起床直後・食事前・同じメジャー・同じ強さ**で測る
        （docs/02-データモデル.md）。日中は食事と姿勢でウエストが2〜3cm動く。
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BodyMeasurement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: putMeasurement
      tags: [body]
      summary: 周囲長の登録・更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BodyMeasurementInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BodyMeasurement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/measurements/latest:
    get:
      operationId: getLatestMeasurement
      tags: [body]
      summary: 直近の周囲長
      description: |
        要件 B-03。**前回値をデフォルト表示するため**に1リクエストで取る。
        記録が無ければ date が null。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  measurement:
                    oneOf:
                      - $ref: "#/components/schemas/BodyMeasurement"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/meals:
    get:
      operationId: listMeals
      tags: [nutrition]
      summary: 食事の一覧
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMeal
      tags: [nutrition]
      summary: 食事の記録
      description: |
        要件 N-01。**食品マスタは持たない**（docs/01-要件定義.md §4.3）。
        名前と PFC を直接入れ、過去の記録がそのまま次回の候補になる。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/meals/{mealId}:
    parameters:
      - name: mealId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMeal
      tags: [nutrition]
      summary: 食事の更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteMeal
      tags: [nutrition]
      summary: 食事の削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/meals/suggestions:
    get:
      operationId: listMealSuggestions
      tags: [nutrition]
      summary: 過去の記録から候補を出す
      description: |
        要件 N-02。**記録履歴がマスタになる。** 同じ名前の記録を頻度順に並べ、
        直近の PFC をそのまま初期値として返す。
        食べるものは100品目程度に収束するので、網羅性より頻出品目への
        最適化が実用的に速い。
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: 名前の部分一致で絞る
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MealSuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/meals/copy:
    post:
      operationId: copyMeals
      tags: [nutrition]
      summary: 別の日の食事を複製する
      description: |
        要件 N-04。前日と同じものを食べる日が多いので、1操作で写せるようにする。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDate, toDate]
              properties:
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
                slot: { $ref: "#/components/schemas/MealSlot" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Meal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/meal-sets:
    get:
      operationId: listMealSets
      tags: [nutrition]
      summary: 食事セットの一覧
      description: |
        要件 N-03。「朝食セット」のように毎回同じ組み合わせで食べるものを
        保存しておき、ワンタップで記録できるようにする。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MealSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMealSet
      tags: [nutrition]
      summary: 食事セットの作成
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealSetInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/meal-sets/{mealSetId}:
    parameters:
      - name: mealSetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateMealSet
      tags: [nutrition]
      summary: 食事セットの更新
      description: 項目は全入れ替え。差分更新にすると順序の付け替えが扱いにくい。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealSetInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteMealSet
      tags: [nutrition]
      summary: 食事セットの削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/meal-sets/{mealSetId}/apply:
    parameters:
      - name: mealSetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: applyMealSet
      tags: [nutrition]
      summary: 食事セットをその日の記録に展開する
      description: |
        要件 N-03。**セットの内容を meals に写す。** 写した後は個別に
        編集・削除できる（実際に食べた量は日によって変わる）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                slot: { $ref: "#/components/schemas/MealSlot" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Meal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/targets/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
        description: JST の日付（ADR-0013）
    get:
      operationId: getDailyTargets
      tags: [nutrition]
      summary: その日の摂取目標と残量
      description: |
        要件 N-05。推定TDEE と目標ペースから出した摂取目標に、
        その日の食事記録を突き合わせて残量を返す。

        **TDEE を推定できないときは target を返さない。** 根拠の無い目標は
        判断を誤らせるので、理由を note に入れる。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTargets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/blood-tests:
    get:
      operationId: listBloodTests
      tags: [body]
      summary: 血液検査の一覧
      description: |
        要件 B-08。年2回の検査結果。**検査項目を固定しない**（クリニックや
        パネルによって違う）。検査票の表をそのまま写せる形で持つ。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BloodTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createBloodTest
      tags: [body]
      summary: 血液検査の登録
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BloodTestInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BloodTest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/blood-tests/{bloodTestId}:
    parameters:
      - name: bloodTestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateBloodTest
      tags: [body]
      summary: 血液検査の更新
      description: 項目は全入れ替え。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BloodTestInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BloodTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteBloodTest
      tags: [body]
      summary: 血液検査の削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/contests:
    get:
      operationId: listContests
      tags: [plan]
      summary: 大会の一覧
      description: |
        要件 P-04。開催日の昇順で返す。カウントダウンと必要ペース判定
        （要件 A-10）の入力になる。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Contest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createContest
      tags: [plan]
      summary: 大会の登録
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContestInput" }
      responses:
        "201":
          description: 作成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/contests/{contestId}:
    parameters:
      - name: contestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateContest
      tags: [plan]
      summary: 大会の更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContestInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      operationId: deleteContest
      tags: [plan]
      summary: 大会の削除（論理削除）
      responses:
        "204": { description: 削除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/plan/blocks:
    get:
      operationId: listPlanBlocks
      tags: [plan]
      summary: 計画のブロック一覧
      description: |
        要件 P-02。3年計画のブロック（LBM の増減と終了時点の体脂肪率）。
        月次目標はここから毎回計算する。**月ごとの表は持たない。**
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PlanBlock" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: putPlanBlocks
      tags: [plan]
      summary: 計画のブロックを保存
      description: まるごと置き換える。順序は配列の並びで決まる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 60
                  items: { $ref: "#/components/schemas/PlanBlock" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PlanBlock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/plan/monthly-targets:
    get:
      operationId: getMonthlyTargets
      tags: [plan]
      summary: 月次目標
      description: |
        要件 P-02 / P-03。起点とブロックから各月末の到達目標を計算して返す。

        **追う順序は LBM → 体脂肪率 → 体重。** 体重は従属変数であって
        目標そのものではない。

        `baseline=measured` を指定すると、**直近の実測（7日平均）を起点に
        引き直す**。計画どおりに進まなかったときはこちらを見る。
      parameters:
        - name: baseline
          in: query
          schema:
            type: string
            enum: [configured, measured]
            default: configured
          description: configured = 設定した起点 / measured = 直近の実測
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyTargets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/plan:
    get:
      operationId: getPlan
      tags: [plan]
      summary: 計画の設定を取得
      description: |
        要件 P-01 / P-05。身長・フェーズ・栄養パラメータ・部位別 MEV/MRV。
        分析（推奨摂取・ボリューム判定）の入力になる。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: putPlan
      tags: [plan]
      summary: 計画の設定を保存
      description: |
        **まるごと置き換える。** フェーズや MEV/MRV を部分更新にすると、
        「消したつもりが残っている」が起きる。設定は頻繁には変えない。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/sync:
    get:
      operationId: pullSync
      tags: [sync]
      summary: 差分の取得
      description: |
        `updatedSince` 以降に変更されたリソースをまとめて返す。
        **削除済み（`deletedAt` が設定されたもの）も含む**（ADR-0014）。
        クライアントはこれを受けてローカルDBを更新する。
      parameters:
        - name: updatedSince
          in: query
          required: true
          schema: { type: string, format: date-time }
          description: 前回同期時にサーバが返した `serverTime` を渡す
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, exercises, sessions, sets, templates]
                properties:
                  serverTime:
                    type: string
                    format: date-time
                    description: 次回の `updatedSince` に使う
                  exercises:
                    type: array
                    items: { $ref: "#/components/schemas/Exercise" }
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSession" }
                  sets:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSet" }
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      operationId: pushSync
      tags: [sync]
      summary: ローカルの変更を一括送信
      description: |
        オフライン中に蓄積した変更をまとめて送る。
        サーバは `updatedAt` を比較し、**サーバ側が新しいものはスキップして
        `conflicts` に含めて返す**（Last Write Wins / ADR-0014）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessions:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutSessionInput" }
                sets:
                  type: array
                  items: { $ref: "#/components/schemas/WorkoutSetInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [applied, conflicts, serverTime]
                properties:
                  applied:
                    type: integer
                    description: 適用された件数
                  conflicts:
                    type: array
                    description: サーバ側が新しく、適用されなかったもの
                    items: { $ref: "#/components/schemas/SyncConflict" }
                  serverTime: { type: string, format: date-time }

  /v1/export/csv:
    get:
      operationId: exportCsv
      tags: [transfer]
      summary: CSV エクスポート
      description: |
        `daily.csv` / `workouts.csv` / `measures.csv` と同じスキーマで出力する。
        Go 実装の検証基準（`reference/analysis/`）の入力形式であり、
        長期バックアップの正でもある（ADR-0002 / ADR-0011）。
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string, enum: [daily, workouts, measures] }
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/import/csv:
    post:
      operationId: importCsv
      tags: [transfer]
      summary: CSV インポート
      description: |
        要件 I-01。アプリ完成前に CSV で記録した期間のデータを取り込む。
        対応するのは本プロジェクトの CSV スキーマのみ。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resource, file]
              properties:
                resource: { type: string, enum: [daily, workouts, measures] }
                file: { type: string, format: binary }
                onDuplicate:
                  type: string
                  enum: [skip, overwrite]
                  default: skip
                  description: 同日・同種目の重複をどう扱うか（要件 I-03）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [imported, skipped, errors]
                properties:
                  imported: { type: integer }
                  skipped: { type: integer }
                  errors:
                    type: array
                    items: { $ref: "#/components/schemas/ImportError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth が発行した JWT。API 側は JWKS で検証し、
        `sub` クレームから user_id を取り出す（インフラ設計 §8）。

  parameters:
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SetId:
      name: setId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MuscleGroup:
      name: muscleGroup
      in: query
      schema: { $ref: "#/components/schemas/MuscleGroup" }
    IncludeDeleted:
      name: includeDeleted
      in: query
      schema: { type: boolean, default: false }
      description: 論理削除済みを含めるか。同期用途以外では false
    DateFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: JST の日付（ADR-0013）
    DateTo:
      name: to
      in: query
      schema: { type: string, format: date }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  schemas:
    MuscleGroup:
      type: string
      description: 部位。肩は前部/中部/後部、背中は広背筋/僧帽筋に分ける
      enum:
        - 胸
        - 広背筋
        - 僧帽筋
        - 肩前部
        - 肩中部
        - 肩後部
        - 上腕二頭
        - 上腕三頭
        - 大腿四頭
        - ハム
        - 臀部
        - ふくらはぎ
        - 腹
      # 値が日本語のため、コード生成器が識別子を導出できず N1..N12 のような
      # 意味のない定数名になる。生成物を読める状態に保つため名前を明示する。
      x-enum-varnames:
        - Chest
        - Lats
        - Traps
        - FrontDelts
        - SideDelts
        - RearDelts
        - Biceps
        - Triceps
        - Quads
        - Hamstrings
        - Glutes
        - Calves
        - Abs

    ImportError:
      type: object
      description: |
        取り込めなかった行。**1行のミスで全部止めない**ので、
        読めた行は取り込んだうえでこれを返す（要件 I-01）。
      required: [line, message]
      properties:
        line:
          type: integer
          description: CSV の行番号（ヘッダが1）
        message: { type: string }

    SyncConflict:
      type: object
      description: |
        push で適用されなかった変更。サーバ側の `updatedAt` の方が新しい（ADR-0014）。
        クライアントは pull し直してから再送する。
      required: [resource, id, serverUpdatedAt]
      properties:
        resource:
          type: string
          enum: [session, set]
          x-enum-varnames: [ConflictSession, ConflictSet]
        id: { type: string, format: uuid }
        serverUpdatedAt: { type: string, format: date-time }

    Timestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: 競合解決に使う（ADR-0014）
        deletedAt:
          type: [string, "null"]
          format: date-time
          description: 論理削除。物理削除しない（ADR-0014）

    Exercise:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, name, muscleGroup]
          properties:
            id: { type: string, format: uuid }
            name:
              type: string
              description: 表記は固定する。ゆれると時系列が分断される
              examples: [ベンチプレス]
            muscleGroup: { $ref: "#/components/schemas/MuscleGroup" }
            isCompound: { type: boolean, default: false }
            defaultRestSec: { type: [integer, "null"], minimum: 0 }

    ExerciseInput:
      type: object
      required: [name, muscleGroup]
      properties:
        id:
          type: string
          format: uuid
          description: クライアント生成の UUID（冪等性のため）
        name: { type: string, minLength: 1, maxLength: 100 }
        muscleGroup: { $ref: "#/components/schemas/MuscleGroup" }
        isCompound: { type: boolean, default: false }
        defaultRestSec: { type: [integer, "null"], minimum: 0 }

    WorkoutSet:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, sessionId, exerciseId, setNo, weightKg, reps]
          properties:
            id: { type: string, format: uuid }
            sessionId: { type: string, format: uuid }
            exerciseId: { type: string, format: uuid }
            setNo: { type: integer, minimum: 1 }
            weightKg:
              type: number
              minimum: 0
              description: kg 固定（データモデル参照）
            reps: { type: integer, minimum: 0 }
            rir:
              type: [integer, "null"]
              minimum: 0
              maximum: 10
              description: |
                Reps In Reserve（あと何回できたか）。
                **これがないと推定1RMが計算できず進捗が測れない**。

    WorkoutSetInput:
      type: object
      required: [exerciseId, setNo, weightKg, reps]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        setNo: { type: integer, minimum: 1 }
        weightKg: { type: number, minimum: 0, maximum: 500 }
        reps: { type: integer, minimum: 0, maximum: 100 }
        rir: { type: [integer, "null"], minimum: 0, maximum: 10 }
        updatedAt: { type: string, format: date-time }

    WorkoutSession:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, date, sets]
          properties:
            id: { type: string, format: uuid }
            date:
              type: string
              format: date
              description: JST の日付（ADR-0013）
            templateId: { type: [string, "null"], format: uuid }
            note: { type: [string, "null"] }
            sets:
              type: array
              items: { $ref: "#/components/schemas/WorkoutSet" }

    WorkoutSessionInput:
      type: object
      required: [date]
      properties:
        id:
          type: string
          format: uuid
          description: クライアント生成の UUID。再送時は冪等に扱われる
        date: { type: string, format: date }
        templateId: { type: [string, "null"], format: uuid }
        note: { type: [string, "null"] }
        sets:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSetInput" }
        updatedAt: { type: string, format: date-time }

    TemplateItem:
      type: object
      required: [exerciseId, order, targetSets]
      properties:
        exerciseId: { type: string, format: uuid }
        order: { type: integer, minimum: 1 }
        targetSets: { type: integer, minimum: 1, maximum: 20 }
        targetRepsMin: { type: [integer, "null"], minimum: 1 }
        targetRepsMax: { type: [integer, "null"], minimum: 1 }
        targetRir: { type: [integer, "null"], minimum: 0, maximum: 10 }

    Template:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, name, items]
          properties:
            id: { type: string, format: uuid }
