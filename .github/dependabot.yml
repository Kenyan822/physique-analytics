version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        patterns: ["*"]
        # メジャーは破壊的変更を含むので、まとめず個別に見る
        update-types: ["minor", "patch"]

  # Dockerfile のベースイメージ（golang / distroless）。
  # Go の依存だけ見ても、ベースイメージ側の CVE は塞げない
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /reference/analysis
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    # まとめて1つの PR にする。個別に立つと週に何本も来て確実に見なくなる
    groups:
      python:
        patterns: ["*"]
    # reference/ は Go 移植の検証基準（ADR-0011）。「Go の出力がこれと一致すること」を
    # 受け入れ条件にしているので、**基準側が動くと比較にならない**。
    # pandas 2→3 / numpy 1→2 は数値の扱いに差が出うるため、メジャーは上げない。
    # セキュリティ修正（patch / minor）は受け入れる。
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  # pnpm でも package-ecosystem は npm
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      web:
        patterns: ["*"]
        # メジャーは破壊的変更を含むのでまとめず個別に見る
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
