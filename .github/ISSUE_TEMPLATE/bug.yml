name: バグ報告
description: 想定と異なる挙動
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
      description: エラーメッセージがあれば全文を貼る
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1. python3 analysis/analyze.py --data-dir data/sample
        2. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 該当箇所
      options: [analysis, ios, web, ci, docs, その他]
    validations:
      required: true
