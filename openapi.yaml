      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        items:
          type: array
          items: { $ref: "#/components/schemas/TemplateItem" }
        updatedAt: { type: string, format: date-time }

    DailyMetrics:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
