            kcal: { type: [integer, "null"], minimum: 0 }
            proteinG: { type: [integer, "null"], minimum: 0 }
            fatG: { type: [integer, "null"], minimum: 0 }
            carbG: { type: [integer, "null"], minimum: 0 }
            sleepH: { type: [number, "null"], minimum: 0, maximum: 24 }
            steps: { type: [integer, "null"], minimum: 0 }
            fatigue:
              type: [integer, "null"]
              minimum: 1
              maximum: 5
              description: 主観的な疲労度（要件 B-06）
            hrvMs: { type: [integer, "null"], exclusiveMinimum: 0 }
            restingHr: { type: [integer, "null"], exclusiveMinimum: 0, maximum: 200 }
            deepSleepMin: { type: [integer, "null"], minimum: 0 }
            note: { type: [string, "null"] }

    DailyMetricsInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        weightKg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 300 }
        bodyfatPct: { type: [number, "null"], minimum: 0, maximum: 70 }
        kcal: { type: [integer, "null"], minimum: 0 }
        proteinG: { type: [integer, "null"], minimum: 0 }
        fatG: { type: [integer, "null"], minimum: 0 }
        carbG: { type: [integer, "null"], minimum: 0 }
        sleepH: { type: [number, "null"], minimum: 0, maximum: 24 }
        steps: { type: [integer, "null"], minimum: 0 }
        fatigue: { type: [integer, "null"], minimum: 1, maximum: 5 }
        hrvMs: { type: [integer, "null"], exclusiveMinimum: 0 }
        restingHr: { type: [integer, "null"], exclusiveMinimum: 0, maximum: 200 }
        deepSleepMin: { type: [integer, "null"], minimum: 0 }
        note: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }

    BodyMeasurement:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, date]
          properties:
            id: { type: string, format: uuid }
            date: { type: string, format: date }
            neckCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
            shoulderCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
            chestCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
            waistNavelCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
            hipCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
            armRCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
            thighRCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 150 }
            calfRCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }

    BodyMeasurementInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        neckCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        shoulderCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
        chestCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
        waistNavelCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
        hipCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 200 }
        armRCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        thighRCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 150 }
        calfRCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        updatedAt: { type: string, format: date-time }

    MealSlot:
      type: string
      enum: [朝食, 昼食, 夕食, 間食]
      x-enum-varnames: [Breakfast, Lunch, Dinner, Snack]

    MealSource:
      type: string
      description: |
        手入力か AI 推定か（docs/02-データモデル.md）。
        推定値の比率が高い週は、体重トレンドとの整合が取れない可能性があるため
        分析の確度を下げて扱う。
      enum: [manual, ai_estimated]
      x-enum-varnames: [Manual, AiEstimated]

    Meal:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, date, name, source]
          properties:
            id: { type: string, format: uuid }
            date:
              type: string
              format: date
              description: JST の日付（ADR-0013）
            slot: { $ref: "#/components/schemas/MealSlot" }
            name: { type: string, examples: [サラダチキン] }
            qty:
              type: [string, "null"]
              description: 「1個」「200g」のような自由記述。単位を型で縛ると入力が止まる
            kcal: { type: [integer, "null"], minimum: 0, maximum: 10000 }
            proteinG: { type: [number, "null"], minimum: 0, maximum: 1000 }
            fatG: { type: [number, "null"], minimum: 0, maximum: 1000 }
            carbG: { type: [number, "null"], minimum: 0, maximum: 2000 }
            source: { $ref: "#/components/schemas/MealSource" }

    MealInput:
      type: object
      required: [date, name]
      properties:
        id:
          type: string
          format: uuid
          description: クライアント生成の UUID（冪等性のため）
        date: { type: string, format: date }
        slot: { $ref: "#/components/schemas/MealSlot" }
        name: { type: string, minLength: 1, maxLength: 200 }
        qty: { type: [string, "null"], maxLength: 50 }
        kcal: { type: [integer, "null"], minimum: 0, maximum: 10000 }
        proteinG: { type: [number, "null"], minimum: 0, maximum: 1000 }
        fatG: { type: [number, "null"], minimum: 0, maximum: 1000 }
        carbG: { type: [number, "null"], minimum: 0, maximum: 2000 }
        source: { $ref: "#/components/schemas/MealSource" }
        updatedAt: { type: string, format: date-time }

    MealSuggestion:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count:
          type: integer
          description: 記録した回数。多い順に並ぶ
        lastDate: { type: [string, "null"], format: date }
        qty: { type: [string, "null"] }
        kcal: { type: [integer, "null"] }
        proteinG: { type: [number, "null"] }
        fatG: { type: [number, "null"] }
        carbG: { type: [number, "null"] }

    PlanPhase:
      type: object
      required: [name, startsOn, endsOn, goalKgPerWeek]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, examples: [P1-A カット1.0%] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        goalKgPerWeek:
          type: number
          minimum: -2
          maximum: 2
          description: 週あたりの体重変化の目標。負なら減量

    MacroRatio:
      type: object
      required: [proteinGPerKg, fatGPerKg]
      properties:
        proteinGPerKg: { type: number, exclusiveMinimum: 0, maximum: 5 }
        fatGPerKg: { type: number, exclusiveMinimum: 0, maximum: 5 }

    NutritionSettings:
      type: object
      required: [cut, deepCut, bulk, deepCutBfThreshold, carbMinG]
      properties:
        cut: { $ref: "#/components/schemas/MacroRatio" }
        deepCut: { $ref: "#/components/schemas/MacroRatio" }
        bulk: { $ref: "#/components/schemas/MacroRatio" }
        deepCutBfThreshold:
          type: number
          exclusiveMinimum: 0
          maximum: 50
          description: この体脂肪率を下回ったらタンパク質を上げる（LBM 保護）
        carbMinG:
          type: integer
          minimum: 0
          maximum: 1000
          description: 炭水化物の下限。割ったらトレーニングの質が落ちる

    VolumeRange:
      type: object
      required: [muscleGroup, mev, mrv]
      properties:
        muscleGroup: { $ref: "#/components/schemas/MuscleGroup" }
        mev: { type: integer, minimum: 0, maximum: 50 }
        mrv: { type: integer, minimum: 0, maximum: 50 }

    Plan:
      type: object
      required: [phases, nutrition, volumeRanges]
      properties:
        heightCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 300 }
        startDate: { type: [string, "null"], format: date }
        baselineWeightKg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 300 }
        baselineBodyfatPct: { type: [number, "null"], minimum: 0, maximum: 70 }
        baselineMonth:
          type: [string, "null"]
          description: 月次目標の起点となる月（YYYY-MM）
        phases:
          type: array
          items: { $ref: "#/components/schemas/PlanPhase" }
        nutrition: { $ref: "#/components/schemas/NutritionSettings" }
        volumeRanges:
          type: array
          items: { $ref: "#/components/schemas/VolumeRange" }

    PlanInput:
      type: object
      required: [phases, nutrition, volumeRanges]
      properties:
        heightCm: { type: [number, "null"], exclusiveMinimum: 0, maximum: 300 }
        startDate: { type: [string, "null"], format: date }
        baselineWeightKg: { type: [number, "null"], exclusiveMinimum: 0, maximum: 300 }
        baselineBodyfatPct: { type: [number, "null"], minimum: 0, maximum: 70 }
        baselineMonth: { type: [string, "null"] }
        phases:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PlanPhase" }
        nutrition: { $ref: "#/components/schemas/NutritionSettings" }
        volumeRanges:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/VolumeRange" }

    Macros:
      type: object
      required: [kcal, proteinG, fatG, carbG]
      properties:
        kcal: { type: number }
        proteinG: { type: number }
        fatG: { type: number }
        carbG: { type: number }

    DailyTargets:
      type: object
      required: [date, consumed]
      properties:
        date: { type: string, format: date }
        phase: { type: [string, "null"] }
        goalKgPerWeek: { type: [number, "null"] }
        tdeeKcal: { type: [number, "null"] }
        target:
          description: 摂取目標。TDEE を推定できないときは null
          oneOf:
            - $ref: "#/components/schemas/Macros"
            - type: "null"
        consumed: { $ref: "#/components/schemas/Macros" }
        remaining:
          description: 目標 − 実績。target が無ければ null
          oneOf:
            - $ref: "#/components/schemas/Macros"
            - type: "null"
        contest:
          description: 次の大会と必要ペース（要件 A-10）
          oneOf:
            - $ref: "#/components/schemas/ContestCountdown"
            - type: "null"
        intakeFloorHit:
          type: boolean
          description: 摂取が下限（体重×24kcal）に達しているか（要件 A-03）
        carbBelowFloor:
          type: boolean
          description: 炭水化物の目標が下限を割っているか（要件 A-03）
        suggestions:
          type: array
          description: |
            残量を埋める食品の候補（要件 N-07）。**履歴から作る**ので、
            食べたことのないものは出ない。目標を超えていれば空。
          items: { $ref: "#/components/schemas/FoodSuggestion" }
        note: { type: [string, "null"] }

    FoodSuggestion:
      type: object
      required: [name, fits, fillsProteinPct]
      properties:
        name: { type: string }
        fits:
          type: boolean
          description: 残りのカロリーに収まるか
        fillsProteinPct:
          type: number
          description: タンパク質の不足を何%埋めるか

    MealSetItem:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        qty: { type: [string, "null"], maxLength: 50 }
        kcal: { type: [integer, "null"], minimum: 0, maximum: 10000 }
        proteinG: { type: [number, "null"], minimum: 0, maximum: 1000 }
        fatG: { type: [number, "null"], minimum: 0, maximum: 1000 }
        carbG: { type: [number, "null"], minimum: 0, maximum: 2000 }

    MealSet:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, name, items]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, examples: [朝食セット] }
            slot: { $ref: "#/components/schemas/MealSlot" }
            items:
              type: array
              items: { $ref: "#/components/schemas/MealSetItem" }

    MealSetInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slot: { $ref: "#/components/schemas/MealSlot" }
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/MealSetItem" }

    ContestCountdown:
      type: object
      required: [heldOn, category, targetBfPct, weeksLeft]
      properties:
        heldOn: { type: string, format: date }
        category: { type: string }
        targetBfPct: { type: number }
        weeksLeft: { type: number }
        stageWeightKg: { type: [number, "null"] }
        needLossKg: { type: [number, "null"] }
        pacePctPerWeek: { type: [number, "null"] }
        tooFast: { type: boolean }

    Contest:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, heldOn, category, targetBfPct]
          properties:
            id: { type: string, format: uuid }
            heldOn:
              type: string
              format: date
              description: |
                開催日。日付が決まる前は**その月の末日**を入れる。
                月内では最終日が一番遠く、必要ペースを過小評価しない
            category: { type: string, examples: [サマスタ スタイリッシュガイ] }
            targetBfPct:
              type: number
              exclusiveMinimum: 0
              maximum: 50
              description: ステージ体脂肪率の目標
            goal:
              type: [string, "null"]
              description: その大会での位置づけ（完走・入賞など）

    ContestInput:
      type: object
      required: [heldOn, category, targetBfPct]
      properties:
        heldOn: { type: string, format: date }
        category: { type: string, minLength: 1, maxLength: 200 }
        targetBfPct: { type: number, exclusiveMinimum: 0, maximum: 50 }
        goal: { type: [string, "null"], maxLength: 200 }

    PlanBlock:
      type: object
      required: [name, months, lbmDeltaKgPerMonth, bodyfatPctEnd]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, examples: [Y1 増量] }
        months: { type: integer, minimum: 1, maximum: 60 }
        lbmDeltaKgPerMonth:
          type: number
          minimum: -2
          maximum: 2
          description: 1ヶ月あたりの除脂肪体重の増減。**これが設計値**
        bodyfatPctEnd:
          type: number
          exclusiveMinimum: 0
          maximum: 60
          description: ブロック終了時点の体脂肪率。途中は等分に動かす
        focus:
          type: [string, "null"]
          maxLength: 500
          description: そのブロックで何をするか。数字だけでは行動が決まらない

    MonthlyTarget:
      type: object
      required: [month, phase, lbmKg, bodyfatPct, weightKg, ffmi]
      properties:
        month: { type: string, examples: ["2026-09"] }
        phase: { type: string }
        lbmKg: { type: number }
        bodyfatPct: { type: number }
        weightKg:
          type: number
          description: LBM と体脂肪率から決まる従属変数
        ffmi: { type: number }

    MonthlyTargets:
      type: object
      required: [baseline, items]
      properties:
        baseline:
          type: object
          required: [source, weightKg, bodyfatPct, month]
          properties:
            source: { type: string, enum: [configured, measured] }
            weightKg: { type: number }
            bodyfatPct: { type: number }
            month: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/MonthlyTarget" }
        note: { type: [string, "null"] }

    RefFlag:
      type: string
      description: |
        基準範囲に対する位置。**基準が無ければ unknown**。
        検査票に書いていない基準を勝手に当てて「異常」と言わない。
      enum: [normal, low, high, unknown]
      x-enum-varnames: [RefNormal, RefLow, RefHigh, RefUnknown]

    BloodTestItem:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, examples: [ヘモグロビン] }
        value:
          type: [number, "null"]
          description: 数値で入らない項目（「陰性」など）は null にして textValue を使う
        textValue: { type: [string, "null"], maxLength: 50 }
        unit: { type: [string, "null"], maxLength: 30, examples: [g/dL] }
        refLow:
          type: [number, "null"]
          description: 基準範囲の下限。**検査票に書いてある値を入れる**
        refHigh: { type: [number, "null"] }
        flag:
          allOf:
            - $ref: "#/components/schemas/RefFlag"
          description: サーバが値と基準範囲から判定して返す（入力では無視される）
          readOnly: true

    BloodTest:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, date, items]
          properties:
            id: { type: string, format: uuid }
            date:
              type: string
              format: date
              description: 採血日（JST。ADR-0013）
            clinic: { type: [string, "null"], maxLength: 100 }
            note: { type: [string, "null"], maxLength: 1000 }
            items:
              type: array
              items: { $ref: "#/components/schemas/BloodTestItem" }
            outOfRangeCount:
              type: integer
              description: 基準外の項目数。まずここを見る
              readOnly: true

    BloodTestInput:
      type: object
      required: [date, items]
      properties:
        date: { type: string, format: date }
        clinic: { type: [string, "null"], maxLength: 100 }
        note: { type: [string, "null"], maxLength: 1000 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/BloodTestItem" }

    Problem:
      type: object
      description: RFC 7807 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          description: バリデーションエラーの詳細
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: 認証されていない
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 見つからない
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        競合。サーバ側の `updatedAt` がクライアントの保持する値より新しい（ADR-0014）。
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: |
        入力値の検証に失敗（要件 §4.8）。
        体重30〜200kg、未来日の禁止、RIR 0〜10 など。
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: DB 接続不可など
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
