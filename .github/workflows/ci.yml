name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN の権限を絞る。CI は読むだけで、書き込む必要がない。
# 既定は書き込み可能なので、明示しないとサードパーティ Action に
# リポジトリへの書き込み権を渡すことになる
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    # openapi.yaml は型の唯一の正（ADR-0007）。壊れると3言語すべての生成が止まる。
    name: openapi (spec 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint openapi.yaml --format stylish

  api:
    name: api (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # バージョンを二重管理しない。go.mod の go / toolchain に従う
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # openapi.yaml が型の唯一の正（ADR-0007）。生成物をコミットしているので、
      # 「spec を変えたのに生成し直していない」状態をここで落とす
      - name: 生成物が最新か検証
        run: |
          go generate ./...
          git diff --exit-code -- gen/ \
            || { echo '::error::openapi.yaml と生成物がずれている。api/ で go generate ./... を実行してコミットすること'; exit 1; }

      # v8 以降が golangci-lint v2 系（.golangci.yaml の version: "2"）に対応する。
      # version を latest にすると action が v1 系を落としてきて
      # 「go1.24 でビルドされた golangci-lint が go 1.27 を対象にできない」で落ちる
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: api

      - name: Build
        run: go build ./...

      # -race: 並行処理のデータ競合は本番でしか再現しないことが多い
      - name: Test
        run: go test ./... -race -cover

      # 依存の既知脆弱性。呼び出し到達性まで見るので pnpm audit より誤検知が少ない
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api-image:
    name: api (コンテナイメージ)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trivy の結果を Security → Code scanning に上げるために必要
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          load: true
          tags: physique-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ベースイメージと同梱物の脆弱性。Go の依存だけ見ても OS 側の穴は塞げない。
      #
      # 2回に分けているのは、目的が違うため:
      #   1回目 … 全 severity を SARIF で出して Security タブに上げる（履歴を残す）
      #   2回目 … CRITICAL/HIGH でビルドを落とす（マージのゲート）
      # 1回目で exit-code を立てると、落ちた時点でアップロードまで到達しない。
      - name: Trivy でスキャン（SARIF 出力）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: physique-api:ci
          format: sarif
          output: trivy-results.sarif
          # ここでは落とさない。ゲートは次のステップ
          exit-code: "0"
          ignore-unfixed: true

      # スキャンが落ちても結果は残す
      - name: SARIF をアップロード
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: CRITICAL / HIGH があれば失敗させる
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: physique-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # 1回目で取得済みの DB を使い回す
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"

  reference:
    # Phase 0 のプロトタイプ（Python）。Go 移植の検証基準として機能させるため、
    # これ自体が正しく動いていることを CI で保証し続ける。
    name: reference (Python プロトタイプ)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reference/analysis/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r analysis/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check analysis/

      - name: Type check (mypy)
        run: mypy analysis/

      - name: Test (pytest)
        run: pytest analysis/tests -v

      # 個別の関数が正しくても、全体の組み合わせが壊れているケースを検出する
      - name: Smoke test (サンプルデータで週次レポートを生成)
        run: |
          python3 analysis/make_sample_data.py
          python3 analysis/analyze.py \
            --data-dir ../data/sample \
            --config ../config.example.json \
            --asof 2026-10-31 \
            --no-write

  # iOS / Web は Phase 2 / Phase 1a で追加する。
  # ios:  runs-on: macos-latest / SwiftLint + xcodebuild test
  # web:  runs-on: ubuntu-latest / ESLint + tsc + vitest + next build
