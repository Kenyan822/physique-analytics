name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    # openapi.yaml は型の唯一の正（ADR-0007）。壊れると3言語すべての生成が止まる。
    name: openapi (spec 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint openapi.yaml --format stylish

  api:
    name: api (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # バージョンを二重管理しない。go.mod の go / toolchain に従う
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # openapi.yaml が型の唯一の正（ADR-0007）。生成物をコミットしているので、
      # 「spec を変えたのに生成し直していない」状態をここで落とす
      - name: 生成物が最新か検証
        run: |
          go generate ./...
          git diff --exit-code -- gen/ \
            || { echo '::error::openapi.yaml と生成物がずれている。api/ で go generate ./... を実行してコミットすること'; exit 1; }

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: api

      - name: Build
        run: go build ./...

      # -race: 並行処理のデータ競合は本番でしか再現しないことが多い
      - name: Test
        run: go test ./... -race -cover

      # 依存の既知脆弱性。呼び出し到達性まで見るので pnpm audit より誤検知が少ない
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  api-image:
    name: api (コンテナイメージ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          load: true
          tags: physique-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ベースイメージと同梱物の脆弱性。Go の依存だけ見ても OS 側の穴は塞げない
      - name: Trivy でイメージをスキャン
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: physique-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  reference:
    # Phase 0 のプロトタイプ（Python）。Go 移植の検証基準として機能させるため、
    # これ自体が正しく動いていることを CI で保証し続ける。
    name: reference (Python プロトタイプ)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reference/analysis/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r analysis/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check analysis/

      - name: Type check (mypy)
        run: mypy analysis/

      - name: Test (pytest)
        run: pytest analysis/tests -v

      # 個別の関数が正しくても、全体の組み合わせが壊れているケースを検出する
      - name: Smoke test (サンプルデータで週次レポートを生成)
        run: |
          python3 analysis/make_sample_data.py
          python3 analysis/analyze.py \
            --data-dir ../data/sample \
            --config ../config.example.json \
            --asof 2026-10-31 \
            --no-write

  # iOS / Web は Phase 2 / Phase 1a で追加する。
  # ios:  runs-on: macos-latest / SwiftLint + xcodebuild test
  # web:  runs-on: ubuntu-latest / ESLint + tsc + vitest + next build
