# Supabase の自動停止を防ぎ、**本番の死活監視も兼ねる**。
#
# Free プランは7日間プロジェクトへのアクセスがないと一時停止され、
# 復旧はダッシュボードからの手動操作になる（docs/05-インフラ設計.md §2.1）。
# 旅行や体調不良で1週間記録が空くと、次に開いたときサービスが落ちている。
#
# /health は DB に ping を打ってから 200 を返すので、これを叩けば
# 非アクティブ判定を回避できる。
name: keepalive

on:
  schedule:
    # **6時間ごと。** 当初は月・木（閾値7日に対して間隔4日）だったが、
    # それだと**落ちてから最大3.5日気づかない**。
    #
    # 実際、GCP の請求先アカウントが閉じて本番が止まったとき、
    # 気づいたのは PM の「通信できない」という報告だった（#278）。
    # 失敗すると GitHub が通知するので、監視として使う。
    #
    # 公開リポジトリなので Actions の実行時間は無料。curl 1回ぶんの価値はある
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: /health を叩く
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 \
              '${{ secrets.API_HEALTH_URL }}/health' || true)
            if [ "$code" = "200" ]; then
              echo "OK: $(cat /tmp/health.json)"
              exit 0
            fi
            # Cloud Run は min-instances=0 なのでコールドスタートを待つ
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::/health が 200 を返さない"
          echo "疑うところ: Supabase の自動停止 / GCP の請求先アカウント（#278）/ デプロイの失敗"
          echo "  gcloud billing accounts describe <ID> の open を見る。"
          echo "  projects describe の billingEnabled が true でも、請求先が閉じていれば止まる"
          cat /tmp/health.json || true
          exit 1
